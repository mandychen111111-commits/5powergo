<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五行能量：尖端深層循環棒 AI 分析儀</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050505;
            color: #f0f0f0;
            overflow-x: hidden;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .gold-border { border: 1px solid rgba(255, 215, 0, 0.4); }
        .gold-text { color: #ffd700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
        .glass-morphism {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scanning-bar {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            top: 0;
            z-index: 30;
            box-shadow: 0 0 15px #ffd700;
            animation: scan-move 4s ease-in-out infinite;
            display: none;
        }

        @keyframes scan-move {
            0% { top: 15%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 85%; opacity: 0; }
        }

        .product-card {
            background: linear-gradient(135deg, rgba(30,30,30,1) 0%, rgba(10,10,10,1) 100%);
            border-left: 4px solid #ffd700;
        }

        #input_video { display: none; }
        
        .pulse-dot {
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .product-image-placeholder {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #333 0%, #111 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        @media (min-width: 768px) {
            .product-image-placeholder {
                width: 80px;
                height: 80px;
            }
        }

        .scale-in-center {
            animation: scale-in-center 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }
        @keyframes scale-in-center {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="relative w-screen h-screen flex flex-col md:flex-row overflow-hidden" id="app-container">
        <!-- 左側：視覺掃描區 -->
        <div id="main-scanner" class="relative w-full h-[65vh] md:h-screen md:flex-grow bg-black flex items-center justify-center overflow-hidden border-b border-white/10 md:border-b-0 transition-all duration-500">
            <video id="input_video" autoplay playsinline></video>
            <canvas id="output_canvas" class="w-full h-full object-cover transform -scale-x-100"></canvas>
            <div id="scanBar" class="scanning-bar"></div>
            
            <div class="absolute inset-0 p-4 md:p-6 pointer-events-none flex flex-col justify-between">
                <!-- Top Section -->
                <div class="flex justify-between items-start gap-2">
                    <div class="glass-morphism p-3 md:p-4 rounded-2xl gold-border pointer-events-auto max-w-[60%] md:max-w-none">
                        <div class="text-[8px] md:text-[10px] text-yellow-500 font-bold uppercase tracking-[0.1em] md:tracking-[0.2em] mb-0.5">Five Elements & Product Sync</div>
                        <div class="text-sm md:text-xl font-bold flex items-center tracking-tighter">
                            能量循環解構儀 <span class="ml-2 text-[8px] border border-yellow-500 text-yellow-500 px-1 py-0.5 rounded-sm animate-pulse">SYNCING</span>
                        </div>
                    </div>
                    <div class="glass-morphism p-2 md:p-3 rounded-xl text-right">
                        <div class="text-[8px] md:text-[10px] text-gray-500 mb-0.5">當前追蹤模組</div>
                        <div id="tracker-status" class="text-[9px] md:text-xs font-mono text-green-400 italic">ACUPRESSURE_POINTS</div>
                    </div>
                </div>

                <!-- Center Tip -->
                <div class="flex justify-center">
                    <div id="main-tip" class="glass-morphism px-4 md:px-8 py-2 md:py-3 rounded-full text-[10px] md:text-sm gold-text border border-yellow-500/30">
                        正在鎖定五嶽能量點...
                    </div>
                </div>

                <!-- Bottom Section -->
                <div class="flex justify-between items-end gap-2">
                    <div class="glass-morphism p-3 md:p-4 rounded-2xl w-32 md:w-48 border-l-4 border-yellow-500">
                        <div class="text-[8px] md:text-[10px] text-gray-400 mb-1.5 uppercase tracking-widest">能量色譜偵測</div>
                        <div id="color-box" class="w-full h-4 md:h-6 rounded bg-gray-800 mb-1.5 border border-white/10 shadow-inner"></div>
                        <div id="color-hex" class="text-[9px] md:text-xs font-mono text-yellow-500">HEX: #---</div>
                    </div>
                    <button id="startBtn" class="pointer-events-auto bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-6 md:px-10 py-3 md:py-5 rounded-2xl shadow-[0_5px_20px_rgba(255,215,0,0.4)] transition-all transform active:scale-95 text-xs md:text-base">
                        啟動分析
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側/下方：報告區域 -->
        <div id="sidebar" class="w-full md:w-[420px] h-[35vh] md:h-screen bg-[#080808] border-t md:border-t-0 md:border-l border-white/10 p-6 md:p-8 overflow-y-auto z-40 transition-all duration-500">
            <div class="max-w-2xl mx-auto h-full flex flex-col">
                <h2 class="text-[9px] md:text-[11px] font-bold tracking-[0.4em] text-yellow-600 mb-4 md:mb-8 flex items-center uppercase">
                    <span class="w-1.5 md:w-2 h-1.5 md:h-2 bg-yellow-600 mr-2"></span> PERSONALIZED CARE REPORT
                </h2>

                <div id="placeholder" class="text-center py-10 md:py-24 opacity-30 flex-grow flex flex-col justify-center">
                    <div class="text-3xl md:text-5xl mb-3 md:mb-4">✨</div>
                    <p class="text-[10px] md:text-xs tracking-widest">等待數據注入...</p>
                </div>

                <div id="result-content" class="hidden space-y-6 md:space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700 pb-10">
                    <!-- 能量分析結果 -->
                    <div class="p-4 md:p-6 rounded-2xl bg-gradient-to-br from-white/5 to-transparent border border-white/10">
                        <div class="flex items-center mb-3 md:mb-4">
                            <div id="final-icon" class="text-3xl md:text-4xl mr-3 md:mr-4 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]"></div>
                            <div>
                                <div id="final-name" class="text-xl md:text-2xl font-bold gold-text"></div>
                                <div class="text-[8px] md:text-[10px] text-gray-500 uppercase tracking-widest">Five Elements Result</div>
                            </div>
                        </div>
                        <p id="final-desc" class="text-xs md:text-sm text-gray-400 leading-relaxed italic"></p>
                    </div>

                    <!-- 產品推薦區 -->
                    <div>
                        <h3 class="text-[10px] font-bold text-gray-500 mb-3 md:mb-4 uppercase tracking-widest">專屬循環棒推薦</h3>
                        <div class="product-card p-4 md:p-5 rounded-2xl flex items-center">
                            <div id="prod-visual" class="product-image-placeholder mr-4 md:mr-5 shrink-0">
                                <div class="w-3 h-10 md:w-4 md:h-12 rounded-full shadow-2xl" id="prod-color-bar"></div>
                            </div>
                            <div class="flex-grow min-w-0">
                                <div id="prod-name" class="text-base md:text-lg font-bold text-white mb-0.5 truncate"></div>
                                <div id="prod-feature" class="text-[9px] md:text-[10px] font-bold text-yellow-500 uppercase tracking-tighter mb-1.5"></div>
                                <p id="prod-desc" class="text-[11px] md:text-xs text-gray-400 leading-snug line-clamp-3 md:line-clamp-none"></p>
                            </div>
                        </div>
                    </div>

                    <!-- 按摩護理建議 -->
                    <div class="space-y-3 md:space-y-4">
                        <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">美容養護指引</h4>
                        <div id="care-tips" class="space-y-2.5 md:space-y-3"></div>
                    </div>

                    <!-- 導購連結按鈕 -->
                    <div class="pt-4">
                        <a href="https://www.show-hair.com/bpw08.php" target="_blank" class="block w-full py-4 bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black text-center font-bold rounded-2xl shadow-[0_10px_25px_rgba(255,215,0,0.3)] transition-all active:scale-95 text-sm md:text-base">
                            立即了解循環力
                        </a>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button onclick="resetAnalysis()" class="text-[10px] md:text-xs text-gray-500 hover:text-yellow-500 underline transition-colors">
                            重新檢測
                        </button>
                    </div>

                    <div class="pt-6 border-t border-white/5 text-center">
                        <p class="text-[8px] md:text-[9px] text-gray-600 leading-relaxed">
                            * 分析建議僅供美容護理參考。尖端深層循環棒非醫療器材。如有不適請停止使用。
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分析完成彈窗 -->
    <div id="overlay-msg" class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-8 text-center transition-all">
        <div class="max-w-xs scale-in-center">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-yellow-600 rounded-full mx-auto mb-5 md:mb-6 flex items-center justify-center text-2xl md:text-3xl shadow-[0_0_40px_rgba(255,215,0,0.4)]">
                ✓
            </div>
            <h3 class="text-xl md:text-2xl font-bold mb-2 md:mb-3 gold-text">分析解構完成</h3>
            <p class="text-gray-400 text-xs md:text-sm mb-6 md:mb-8 leading-relaxed">您的五行特徵與循環棒適配數據已成功計算。</p>
            <button onclick="switchToReportView()" class="w-full py-3 md:py-4 bg-yellow-600 hover:bg-yellow-500 rounded-2xl font-bold text-black transition-all text-sm md:text-base">讀取報告</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const scanBar = document.getElementById('scanBar');
        const colorBox = document.getElementById('color-box');
        const sidebar = document.getElementById('sidebar');
        const mainScanner = document.getElementById('main-scanner');
        
        let isAnalyzing = false;
        let lastData = { geometry: 0, rgb: [0,0,0], bright: 0 };
        const SCAN_POINTS = [10, 1, 152, 234, 454];
        // 採樣點：鼻尖、左臉頰、右臉頰、額頭、下巴
        const SKIN_SAMPLE_POINTS = [1, 50, 280, 10, 152];
        const frameHistory = [];
        const HISTORY_SIZE = 30;

        function sampleSkinRGB(landmarks) {
            let rSum = 0, gSum = 0, bSum = 0, count = 0;
            SKIN_SAMPLE_POINTS.forEach(idx => {
                const pt = landmarks[idx];
                const cx = Math.round(pt.x * canvasElement.width);
                const cy = Math.round(pt.y * canvasElement.height);
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const x = cx + dx, y = cy + dy;
                        if (x >= 0 && x < canvasElement.width && y >= 0 && y < canvasElement.height) {
                            const d = canvasCtx.getImageData(x, y, 1, 1).data;
                            rSum += d[0]; gSum += d[1]; bSum += d[2];
                            count++;
                        }
                    }
                }
            });
            return count > 0
                ? [Math.round(rSum / count), Math.round(gSum / count), Math.round(bSum / count)]
                : [128, 128, 128];
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        faceMesh.onResults(results => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#ffd70011', lineWidth: 0.3});
                drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {color: '#ffd70033', lineWidth: 1});
                drawMountainNodes(landmarks);

                const rawRGB = sampleSkinRGB(landmarks);
                const h = Math.abs(landmarks[152].y - landmarks[10].y);
                const w = Math.abs(landmarks[454].x - landmarks[234].x);
                const rawGeo = h / w;

                frameHistory.push({ geometry: rawGeo, rgb: rawRGB });
                if (frameHistory.length > HISTORY_SIZE) frameHistory.shift();

                const n = frameHistory.length;
                const avgGeo = frameHistory.reduce((s, f) => s + f.geometry, 0) / n;
                const avgR = Math.round(frameHistory.reduce((s, f) => s + f.rgb[0], 0) / n);
                const avgG = Math.round(frameHistory.reduce((s, f) => s + f.rgb[1], 0) / n);
                const avgB = Math.round(frameHistory.reduce((s, f) => s + f.rgb[2], 0) / n);

                lastData.geometry = avgGeo;
                lastData.rgb = [avgR, avgG, avgB];
                lastData.bright = (avgR + avgG + avgB) / 3;

                colorBox.style.backgroundColor = `rgb(${avgR}, ${avgG}, ${avgB})`;
                document.getElementById('color-hex').innerText = `HEX: #${avgR.toString(16).padStart(2,'0')}${avgG.toString(16).padStart(2,'0')}${avgB.toString(16).padStart(2,'0')}`;
            }
            canvasCtx.restore();
        });

        function drawMountainNodes(landmarks) {
            const time = Date.now() * 0.005;
            SCAN_POINTS.forEach(idx => {
                const p = landmarks[idx];
                const x = p.x * canvasElement.width;
                const y = p.y * canvasElement.height;
                const pulse = 6 + Math.sin(time) * 3;
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, pulse, 0, 2 * Math.PI);
                canvasCtx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                canvasCtx.lineWidth = 1;
                canvasCtx.stroke();
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, 2, 0, 2 * Math.PI);
                canvasCtx.fillStyle = '#ffd700';
                canvasCtx.shadowBlur = 8;
                canvasCtx.shadowColor = '#ffd700';
                canvasCtx.fill();
                canvasCtx.shadowBlur = 0;
            });
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start();

        startBtn.addEventListener('click', () => {
            isAnalyzing = true;
            scanBar.style.display = 'block';
            startBtn.disabled = true;
            startBtn.innerText = "計算中...";
            document.getElementById('main-tip').innerText = "正在解構五行氣韻...";

            setTimeout(() => {
                scanBar.style.display = 'none';
                isAnalyzing = false;
                startBtn.disabled = false;
                startBtn.innerText = "重新分析";
                document.getElementById('main-tip').innerText = "分析完成";
                document.getElementById('placeholder').style.display = 'none';
                renderProductReport();
                document.getElementById('overlay-msg').classList.remove('hidden');
            }, 3500);
        });

        function switchToReportView() {
            document.getElementById('overlay-msg').classList.add('hidden');
            mainScanner.classList.add('hidden');
            sidebar.classList.remove('md:w-[420px]', 'h-[35vh]');
            sidebar.classList.add('w-full', 'h-screen');
            sidebar.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetAnalysis() {
            mainScanner.classList.remove('hidden');
            sidebar.classList.add('md:w-[420px]', 'h-[35vh]');
            sidebar.classList.remove('w-full', 'h-screen');
            document.getElementById('result-content').classList.add('hidden');
            document.getElementById('placeholder').style.display = 'block';
            startBtn.innerText = "啟動分析";
        }

        function renderProductReport() {
            const { geometry, rgb, bright } = lastData;
            const [r, g, b] = rgb;

            const PRODUCTS = {
                GOLD: { name: "香檳金 循環棒", feature: "活力 • 自信", color: "#EAC17C", desc: "助於提升肌膚活力與自信感。猶如暖陽映照，展現充沛生命力。" },
                GRAY: { name: "太空灰 循環棒", feature: "平衡 • 生機", color: "#7F7F7F", desc: "為保養注入生機，助於舒緩壓力感與累積的疲勞。" },
                BLACK: { name: "質感黑 循環棒", feature: "流動 • 靈活", color: "#1A1A1A", desc: "象徵寧靜流動，助於舒緩壓力感，提升肌膚細緻的柔軟度。" },
                RED: { name: "幸福紅 循環棒", feature: "激情 • 提振", color: "#C0392B", desc: "提振精神活力，點燃內在熱情，幫助肌膚展現紅潤光采。" },
                BROWN: { name: "焦糖棕 循環棒", feature: "安心 • 穩固", color: "#935116", desc: "帶來沉穩安心感，助於維持肌膚平衡，打造穩定的養護基石。" }
            };

            let result;

            // 木形人：臉型修長（高寬比最大），純幾何判斷
            if (geometry > 1.55) {
                result = { element: "木形人", icon: "🌲", desc: "形相清秀，展現強韌生命力與剛直氣息。", product: PRODUCTS.GRAY, care: ["使用循環棒按壓額頭中心，幫助舒緩壓力感", "橫向滑動按摩額部，維護肌膚平滑質感", "增加環境濕度，輔助維持肌膚水潤健康"] };
            }
            // 火形人：紅通道明顯主導，膚色紅潤偏暖（多點平均後門檻微降）
            else if (r > g + 35 && r > b + 35) {
                result = { element: "火形人", icon: "🔥", desc: "輪廓鮮明，神采奕奕，展現熱情感染力。", product: PRODUCTS.RED, care: ["點按嘴部兩側，展現自信親和魅力", "維持室內通風舒適，幫助肌膚穩定狀態", "強化日間防護，幫助維持肌膚亮透光采"] };
            }
            // 土形人：中等臉型 + 暖黃色調（r、g 均高於 b，放寬幾何門檻至 1.2）
            else if (geometry >= 1.2 && r > b + 10 && g > b + 5) {
                result = { element: "土形人", icon: "⛰️", desc: "形相穩重，予人厚實包容感與穩定感。", product: PRODUCTS.BROWN, care: ["點按鼻翼兩側，維持舒適能量感", "加強毛孔深層清潔，幫助維持肌膚平滑質感", "護膚最後步驟按壓頰部，鎖住水分"] };
            }
            // 水形人：寬圓臉型（純幾何，修正原 OR 邏輯誤判）
            else if (geometry < 1.22) {
                result = { element: "水形人", icon: "💧", desc: "輪廓圓潤，氣色潤透，具備極佳的智慧與適應力。", product: PRODUCTS.BLACK, care: ["使用循環棒輕按眼周，舒緩疲勞感", "以筆身由內向外滑動，維護肌膚細緻緊度", "加強夜間修復養護，展現晶瑩透亮感"] };
            }
            // 金形人：預設，輪廓均勻細緻、亮度佳
            else {
                result = { element: "金形人", icon: "⚔️", desc: "您的輪廓俐落且具備細緻光澤感，展現俐落的決斷特質。", product: PRODUCTS.GOLD, care: ["以循環棒點按太陽穴，幫助提振精神活力", "沿下顎線向上按摩，維護肌膚彈力輪廓", "維持規律生活，展現自然健康光采"] };
            }

            document.getElementById('final-icon').innerText = result.icon;
            document.getElementById('final-name').innerText = result.element;
            document.getElementById('final-desc').innerText = result.desc;
            document.getElementById('prod-name').innerText = result.product.name;
            document.getElementById('prod-feature').innerText = result.product.feature;
            document.getElementById('prod-desc').innerText = result.product.desc;
            document.getElementById('prod-color-bar').style.backgroundColor = result.product.color;
            document.getElementById('prod-color-bar').style.boxShadow = `0 0 10px ${result.product.color}aa`;

            const list = document.getElementById('care-tips');
            list.innerHTML = "";
            result.care.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-start text-[11px] md:text-xs text-gray-400 bg-white/5 p-3 rounded-xl border border-white/5";
                div.innerHTML = `<span class="text-yellow-600 mr-2 shrink-0">✦</span><span>${item}</span>`;
                list.appendChild(div);
            });

            document.getElementById('result-content').classList.remove('hidden');
        }

        function handleResize() {
            canvasElement.width = canvasElement.clientWidth;
            canvasElement.height = canvasElement.clientHeight;
        }
        window.addEventListener('resize', handleResize);
        setTimeout(handleResize, 1000);
    </script>
</body>
</html>
